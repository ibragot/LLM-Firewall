[project]
name = "llm-firewall"
version = "0.1.0"
description = "A security gateway (reverse proxy) for LLM applications: prompt-injection detection and output data-leak redaction."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
# Training the baseline, running the eval suite, drawing charts.
ml = ["scikit-learn>=1.4", "numpy>=1.26", "pandas>=2.2", "pyarrow>=15", "matplotlib>=3.8"]
# Layer C (transformer). Heavy: only needed locally / in Docker / in Colab.
transformer = ["torch>=2.2", "transformers>=4.40", "tokenizers>=0.15", "accelerate>=0.28"]
dev = ["pytest>=8", "ruff>=0.4", "mypy>=1.9", "types-PyYAML"]

[project.scripts]
llm-firewall = "llm_firewall.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["llm_firewall*"]

[tool.setuptools.package-data]
llm_firewall = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore:Using `httpx` with:Warning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
